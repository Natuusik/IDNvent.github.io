<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подсчёт рабочих часов</title>

<!-- Настройки для PWA (автономного приложения) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Hours">

<!-- Иконка приложения (можно заменить на свою ссылку) -->
<link rel="apple-touch-icon" href="https://flaticon.com">
<link rel="icon" href="https://flaticon.com">

<!-- Манифест для установки на телефон -->
<link rel="manifest" href="data:application/manifest+json, {
  &quot;name&quot;: &quot;Подсчёт рабочих часов&quot;,
  &quot;short_name&quot;: &quot;Часы&quot;,
  &quot;start_url&quot;: &quot;.&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#eef1f5&quot;,
  &quot;theme_color&quot;: &quot;#0078ff&quot;,
  &quot;icons&quot;: [
    {
      &quot;src&quot;: &quot;https://flaticon.com&quot;,
      &quot;sizes&quot;: &quot;512x512&quot;,
      &quot;type&quot;: &quot;image/png&quot;
    }
  ]
}">

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 640px;
        margin: 20px auto;
        padding: 15px;
        background: #eef1f5;
        border-radius: 12px;
    }

    h2 {
        text-align: center;
        margin-bottom: 15px;
        font-size: 22px;
    }

    .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 15px;
    }

    select {
        padding: 8px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #bfc7d1;
    }

    .day-row {
    display: grid;
    grid-template-columns: 24px 90px 90px 50px 40px;
    gap: 8px;
    padding: 8px;
    background: #ffffff;
    border-radius: 8px;
    margin-bottom: 5px;
    align-items: center;
    border: 1px solid #dcdcdc;
}


    .day-row.weekend {
        background: #ffe6e6;
    }

    .day-row.holiday {
        background: #ffb3b3;
        border-color: #ff4d4d;
    }

    .day-num {
        font-weight: bold;
        text-align: center;
        font-size: 14px;
    }

    .holiday-title {
        font-size: 12px;
        color: #b30000;
        grid-column: 2 / 5;
        text-align: center;
        font-weight: bold;
    }

    input[type="time"],
    input[type="number"] {
        padding: 6px;
        width:60px;
        border: 1px solid #bfc7d1;
        border-radius: 6px;
        font-size: 14px;
        background: #fafafa;
        box-sizing: border-box;
    }

    .res {
        font-size: 14px;
        font-weight: bold;
        text-align: right;
        color: #333;
    }

    button {
        margin-top: 10px;
        padding: 12px;
        width: 100%;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
    }

    button:hover {
        background: #005fcc;
    }

    .save-block {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 2px solid #ccc;
    }

    .save-block button {
        background: #28a745;
        margin-top: 0;
    }

    #clearBtn {
        background: #d9534f;
    }

    #total {
        margin-top: 15px;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        color: #222;
    }
</style>
</head>

<body>

<h2>Подсчёт рабочих часов</h2>

<div class="controls">
    <select id="monthSelect" onchange="onCalendarChange()"></select>
    <select id="yearSelect" onchange="onCalendarChange()"></select>
</div>

<div id="days"></div>

<button onclick="calculateTotal()">Посчитать месяц</button>
<button id="clearBtn" onclick="clearAll()">Очистить месяц</button>

<div id="total">Итого: 0:00</div>

<div class="save-block">
    <button onclick="exportToTXT()">Скачать TXT</button>
    <button onclick="copyToClipboard()">Скопировать</button>
    <button style="background: #17a2b8;" onclick="exportData()">Экспорт базы</button>
    <button style="background: #17a2b8;" onclick="importData()">Импорт базы</button>
</div>

<!-- Кнопка установки приложения, которая появится только на телефоне/ПК -->
<button id="installBtn" style="display:none; background:#ffc107; color:#222; margin-top:20px;">Установить приложение на экран</button>

<script>
// ВЕСЬ JS КОД ОСТАЕТСЯ ТАКИМ ЖЕ, КАК В ПРОШЛОМ ОТВЕТЕ
const daysContainer = document.getElementById("days");
const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");

const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

const savedSession = localStorage.getItem("lastCalendarView");
const lastSession = savedSession ? JSON.parse(savedSession) : { month: 0, year: 2026 };

const startYear = 2026;
for (let i = 0; i < 12; i++) {
    monthSelect.innerHTML += `<option value="${i}" ${(i === lastSession.month) ? 'selected' : ''}>${monthNames[i]}</option>`;
}
for (let i = startYear; i <= startYear + 10; i++) {
    yearSelect.innerHTML += `<option value="${i}" ${(i === lastSession.year) ? 'selected' : ''}>${i}</option>`;
}

function getEasterDate(year) {
    const a = year % 19; const b = Math.floor(year / 100); const c = year % 100;
    const d = Math.floor(b / 4); const e = b % 4; const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3); const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4); const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
}

function getEstonianHolidays(year) {
    const holidays = {"0-1": "Uusaasta", "1-24": "Iseseisvuspäev", "4-1": "Kevadpüha", "5-23": "Võidupüha", "5-24": "Jaanipäev", "7-20": "Taasiseseisvumispäev", "11-24": "Jõululaupäev", "11-25": "Esimene jõulupüha", "11-26": "Teine jõulupüha"};
    const easter = getEasterDate(year);
    const goodFriday = new Date(easter); goodFriday.setDate(easter.getDate() - 2);
    const pentecost = new Date(easter); pentecost.setDate(easter.getDate() + 49);
    holidays[`${goodFriday.getMonth()}-${goodFriday.getDate()}`] = "Suur reede";
    holidays[`${easter.getMonth()}-${easter.getDate()}`] = "Ülestõusmispühade 1. püha";
    holidays[`${pentecost.getMonth()}-${pentecost.getDate()}`] = "Nelipühade 1. püha";
    return holidays;
}

function onCalendarChange() {
    localStorage.setItem("lastCalendarView", JSON.stringify({month: parseInt(monthSelect.value), year: parseInt(yearSelect.value)}));
    buildCalendar();
}

function buildCalendar() {
    const year = parseInt(yearSelect.value); const month = parseInt(monthSelect.value);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const estonianHolidays = getEstonianHolidays(year);
    const saved = localStorage.getItem("workHours");
    const monthData = saved ? (JSON.parse(saved)[`${year}-${month}`] || {}) : {};

    daysContainer.innerHTML = "";
    for (let i = 1; i <= daysInMonth; i++) {
        const date = new Date(year, month, i);
        const dayOfWeek = date.getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const holidayName = estonianHolidays[`${month}-${i}`];
        
        let rowClass = "day-row";
        if (holidayName) rowClass += " holiday"; else if (isWeekend) rowClass += " weekend";

        const dayData = monthData[i] || { start: "", end: "", lunch: "" };

        daysContainer.innerHTML += `
            <div class="${rowClass}">
                <span class="day-num">${i}</span>
                ${holidayName ? 
                    `<span class="holiday-title">${holidayName}</span>` : 
                    `<input type="time" id="start${i}" value="${dayData.start}" oninput="saveData()">
                     <input type="time" id="end${i}" value="${dayData.end}" oninput="saveData()">
                     <input type="number" id="lunch${i}" placeholder="Об." min="0" value="${dayData.lunch}" oninput="saveData()">`
                }
                <span id="res${i}" class="res">0:00</span>
            </div>`;
    }
    calculateTotal(false);
}

function formatHM(minutes) { return `${Math.floor(minutes / 60)}:${(minutes % 60).toString().padStart(2, "0")}`; }

function saveData() {
    const year = yearSelect.value;
    const month = monthSelect.value;
    const allData = JSON.parse(localStorage.getItem("workHours") || "{}");
    const monthData = {};

    for (let i = 1; i <= new Date(year, parseInt(month) + 1, 0).getDate(); i++) {
        const startElem = document.getElementById(`start${i}`);
        if (startElem) {
            monthData[i] = {
                start: startElem.value,
                end: document.getElementById(`end${i}`).value,
                lunch: document.getElementById(`lunch${i}`).value
            };
        }
    }

    allData[`${year}-${month}`] = monthData;
    localStorage.setItem("workHours", JSON.stringify(allData));

    calculateTotal(false); // ← ДОБАВЛЕНО
}

function calculateTotal(shouldSave = true) {
    let totalMinutes = 0;
    let workDays = 0;

    const year = parseInt(yearSelect.value);
    const month = parseInt(monthSelect.value);
    const holidays = getEstonianHolidays(year);
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 1; i <= daysInMonth; i++) {
        const date = new Date(year, month, i);
        const dayOfWeek = date.getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isHoliday = holidays[`${month}-${i}`];

        // считаем рабочие дни
        if (!isWeekend && !isHoliday) workDays++;

        const startElem = document.getElementById(`start${i}`);
        if (!startElem) continue;

        const start = startElem.value;
        const end = document.getElementById(`end${i}`).value;

        if (!start || !end) {
            document.getElementById(`res${i}`).textContent = "0:00";
            continue;
        }

        const [sh, sm] = start.split(":").map(Number);
        const [eh, em] = end.split(":").map(Number);
        const lunch = parseInt(document.getElementById(`lunch${i}`).value) || 0;

        const diff = Math.max(0, (eh * 60 + em) - (sh * 60 + sm) - lunch);
        document.getElementById(`res${i}`).textContent = formatHM(diff);

        totalMinutes += diff;
    }

    // итог часов
    document.getElementById("total").textContent =
        `Итого: ${formatHM(totalMinutes)} (рабочих дней: ${workDays}, нормо‑часы: ${workDays * 8}:00)`;

    if (shouldSave) saveData();
}

function generateReportText() {
    const year = yearSelect.value; const month = monthSelect.value;
    let text = `ОТЧЁТ [${monthNames[month]} ${year}]\n-----------------------------------\n`;
    const holidays = getEstonianHolidays(parseInt(year));
    for (let i = 1; i <= new Date(year, parseInt(month) + 1, 0).getDate(); i++) {
        const hName = holidays[`${month}-${i}`];
        if (hName) { text += `${i.toString().padStart(2, '0')}: [ ${hName} ]\n`; continue; }
        const s = document.getElementById(`start${i}`).value;
        text += `${i.toString().padStart(2, '0')}: ${s ? `${s} - ${document.getElementById(`end${i}`).value} (Обед: ${document.getElementById(`lunch${i}`).value || 0}м) = ${document.getElementById(`res${i}`).textContent}` : '---'}\n`;
    }
    return text + `-----------------------------------\n` + document.getElementById("total").textContent;
}

function exportToTXT() {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([generateReportText()], { type: "text/plain;charset=utf-8" }));
    link.download = `Otchet_${monthNames[monthSelect.value]}_${yearSelect.value}.txt`;
    link.click();
}

function copyToClipboard() {
    navigator.clipboard.writeText(generateReportText()).then(() => alert("Скопировано!")).catch(() => alert("Ошибка копирования"));
}

function exportData() {
    const data = localStorage.getItem("workHours");
    if (!data) return alert("Нет данных");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    link.download = "work_hours_database.json"; link.click();
}

function importData() {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => { try { JSON.parse(ev.target.result); localStorage.setItem("workHours", ev.target.result); alert("Успешно!"); buildCalendar(); } catch { alert("Ошибка файла"); } }
        reader.readAsText(e.target.files[0]);
    }
    input.click();
}

function clearAll() {
    const allData = JSON.parse(localStorage.getItem("workHours") || "{}");
    delete allData[`${yearSelect.value}-${monthSelect.value}`];
    localStorage.setItem("workHours", JSON.stringify(allData));
    buildCalendar();
}

buildCalendar();

// ЛОГИКА ДЛЯ УСТАНОВКИ ПРИЛОЖЕНИЯ
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      installBtn.style.display = 'none';
    }
    deferredPrompt = null;
  }
});
</script>

</body>
</html>
